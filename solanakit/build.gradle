plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlinx-serialization'
    id 'com.google.devtools.ksp'
    id 'maven-publish'
}

android {
    compileSdk 34

    defaultConfig {
        minSdk 26
        targetSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
                "-Xjvm-default=all",
        ]
    }
    namespace 'io.horizontalsystems.solanakit'

    def bcprovVersionsToRedirect = [
            'bcprov-jdk15on:1.65',
            'bcprov-jdk15on:1.65.01',
            'bcprov-jdk15on:1.66',
            'bcprov-jdk15on:1.70',
            'bcprov-jdk15to18:1.65',
            'bcprov-jdk15to18:1.65.01',
            'bcprov-jdk15to18:1.68',
            'bcprov-jdk15to18:1.69'
    ]
    configurations.all { c ->
        c.resolutionStrategy.dependencySubstitution {
            bcprovVersionsToRedirect.each { moduleId ->
                def (name, version) = moduleId.split(':')
                substitute module("org.bouncycastle:$name:$version") using module("org.bouncycastle:bcprov-jdk15to18:1.80")
            }

        }
        /*resolutionStrategy.eachDependency {
            if (requested.group == "com.github.metaplex-foundation" &&
                    requested.name == "SolanaKT") {
                useTarget(libs.solanakt)
            }
        }*/
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.piratecash'
                artifactId = 'solana-kit-android'
                version = providers.environmentVariable("JITPACK_VERSION")
                    .orElse(providers.environmentVariable("VERSION"))
                    .orElse(providers.environmentVariable("VERSION_NAME"))
                    .orElse(providers.environmentVariable("PUBLISH_VERSION"))
                    .getOrElse("local")
            }
        }
        repositories {
            maven {
                name = "local"
                url = uri(layout.buildDirectory.dir("maven-repo"))
            }
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation libs.kotlinx.coroutines.android

    implementation(libs.sol4k)
    implementation(libs.solanakt)

    implementation(libs.metaplex.android) {
        exclude group: 'com.github.metaplex-foundation.kborsh', module: 'kborsh-jvm'
        exclude group: 'com.github.metaplex-foundation', module: 'SolanaKT'
    }

    implementation libs.moshi.kotlin
    implementation libs.okhttp
    implementation libs.okhttp.logging.interceptor

    implementation libs.retrofit
    implementation libs.adapter.rxjava2
    implementation libs.converter.gson
    implementation libs.converter.scalars
    implementation libs.kotlinx.coroutines.rx2
    implementation libs.gson

    implementation libs.room.runtime
    implementation libs.room.ktx
    ksp libs.room.compiler

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

}
