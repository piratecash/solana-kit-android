gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
hd-wallet-kit-kmp-android = { module = "com.github.piratecash.hd-wallet-kit-android:hd-wallet-kit-kmp-android", version.ref = "hdWalletKitKmp" }
