sol4k = { module = "org.sol4k:sol4k", version.ref = "sol4k" }

okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp-logging-interceptor" }
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "mockwebserver" }
solanakt = { module = "com.github.piratecash:SolanaKT", version.ref = "solanakt" }
sqlcipher-room = { module = "com.github.piratecash.bitcoin-kit-android:sqlcipher-room", version.ref = "piratecashBitcoin" }
