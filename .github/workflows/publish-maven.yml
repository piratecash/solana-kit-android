name: Publish to Maven (GitHub Pages)

on:
  push:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: touch local.properties

      - name: Resolve publish version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "PUBLISH_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "PUBLISH_VERSION=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV
          fi

      - name: Build and publish to local repo
        run: ./gradlew :solanakit:publishReleasePublicationToLocalRepository
        env:
          PUBLISH_VERSION: ${{ env.PUBLISH_VERSION }}

      - name: Prepare gh-pages
        run: |
          REMOTE_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git clone --depth 1 --branch gh-pages "$REMOTE_URL" gh-pages 2>/dev/null || {
            mkdir gh-pages
            cd gh-pages
            git init
          }

      - name: Copy artifacts to gh-pages
        run: cp -r solanakit/build/maven-repo/* gh-pages/

      - name: Keep only last 20 versions
        run: |
          REPO_PATH="gh-pages/com/github/piratecash/solana-kit-android"
          if [ -d "$REPO_PATH" ]; then
            cd "$REPO_PATH"
            ls -dt */ | tail -n +21 | xargs -r rm -rf
          fi

      - name: Commit and push to gh-pages
        run: |
          cd gh-pages
          git checkout -B gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Publish ${{ env.PUBLISH_VERSION }}"
          git remote remove origin 2>/dev/null || true
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push --force origin gh-pages
